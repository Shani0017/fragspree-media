<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics - Comment Hub</title>
<style>
:root{--bg:#0f1220;--card:#181c33;--ink:#eef0ff;--dim:#8f95b8;--line:#262b4d;--acc:#6d5efc;--ok:#2fd27a;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 8px;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
nav a{color:var(--dim);text-decoration:none;font-size:14px;margin-right:12px}nav a.on{color:var(--ink);font-weight:600}
button,select,input{font:inherit;color:var(--ink);background:#222750;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
button.on{background:var(--acc);border-color:var(--acc)}button.primary{background:var(--acc);border-color:var(--acc);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
main{padding:12px 16px 40px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.v{font-size:26px;font-weight:700;margin-top:2px}.s{color:var(--dim);font-size:12px;margin-top:2px}
h2{font-size:16px;margin:22px 0 8px}
.bar{display:grid;grid-template-columns:90px 1fr 120px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#6d5efc,#9d8cff)}
.bar span.t{color:var(--dim);text-align:right}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
td a{color:#b9b0ff;text-decoration:none}td.ti{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insight{background:#143a2a;color:#a8f0c9;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.5}
.note{background:#3a2a14;color:#ffd9a0;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}
.dim{color:var(--dim);font-size:12px}
svg{width:100%;height:auto;display:block}
@media(max-width:600px){.bar{grid-template-columns:70px 1fr 100px}td.ti{max-width:150px}}
</style></head><body>
<header>
<h1><span>Analytics</span><button class="primary" id="refresh">Refresh data</button></h1>
<nav><a href="/">Comments</a><a href="/analytics" class="on">Analytics</a></nav>
<div class="row" id="presets"></div>
<div class="row"><input type="date" id="from"><span class="dim">to</span><input type="date" id="to">
<select id="acct"><option value="">Both accounts</option><option>FragSpree</option><option>Brain Massage</option></select>
<select id="plat"><option value="">All platforms</option><option>Instagram</option><option>YouTube</option></select>
<select id="kind"><option value="">All content</option><option>ASMR</option><option>Math</option><option>Interview</option><option>Music</option></select></div>
</header>
<main>
<div id="notes"></div>
<div id="insight"></div>
<div class="grid" id="kpi"></div>
<h2>Followers / subscribers</h2><div class="grid" id="growth"></div>
<div class="dim" id="growthnote"></div>
<h2>Views by day posted</h2><div class="card"><div id="daily"></div></div>
<h2>Which content works (average per post)</h2><div class="card" id="bykind"></div>
<h2>Best time to post (Malaysia time, average views)</h2><div class="card" id="byhour"></div>
<h2>Best weekday</h2><div class="card" id="bywd"></div>
<h2>By account and platform</h2><div class="card" id="byacct"></div>
<h2>Top posts</h2><div class="card" style="overflow-x:auto"><table id="top"></table></div>
<p class="dim" id="foot"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const api=(p,b)=>fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Hub':'1'},body:JSON.stringify(b)}).then(r=>r.json());
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const PRE=[['Today',0],['7 days',6],['14 days',13],['30 days',29],['90 days',89],['All time',-1]];
let preset='30 days';
$('presets').innerHTML=PRE.map(([l])=>`<button data-p="${l}">${l}</button>`).join('');
function setPreset(l){preset=l;const n=PRE.find(x=>x[0]===l)[1];const t=new Date();
  if(n<0){$('from').value='';$('to').value='';}else{const f=new Date();f.setDate(t.getDate()-n);$('from').value=iso(f);$('to').value=iso(t);}
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===l));load();}
document.querySelectorAll('#presets button').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
['from','to'].forEach(i=>$(i).onchange=()=>{document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('on'));load();});
['acct','plat','kind'].forEach(i=>$(i).onchange=load);
function bars(rows,key,label){const mx=Math.max(1,...rows.map(r=>r[key]));
  return rows.length?rows.map(r=>`<div class="bar"><span>${esc(r.name)}</span><i style="width:${Math.max(2,100*r[key]/mx)}%"></i><span class="t">${fmt(r[key])} avg &middot; ${r.posts} post${r.posts===1?'':'s'}${label?` &middot; ${r.eng}%`:''}</span></div>`).join(''):'<span class="dim">No posts in this range.</span>';}
function spark(series){if(series.length<2)return '';const v=series.map(s=>s[1]),mn=Math.min(...v),mx=Math.max(...v),w=240,h=40;
  const pts=series.map((s,i)=>`${(i/(series.length-1))*w},${h-4-((s[1]-mn)/Math.max(1,mx-mn))*(h-8)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#9d8cff" stroke-width="2" points="${pts}"/></svg>`;}
function dailyChart(rows){if(!rows.length)return '<span class="dim">No posts in this range.</span>';const w=700,h=170,p=24,mx=Math.max(1,...rows.map(r=>r.views)),bw=Math.max(3,(w-p*2)/rows.length-3);
  return `<svg viewBox="0 0 ${w} ${h}">`+rows.map((r,i)=>{const x=p+i*((w-p*2)/rows.length),bh=(r.views/mx)*(h-p*2);return `<rect x="${x}" y="${h-p-bh}" width="${bw}" height="${bh}" rx="3" fill="#6d5efc"><title>${r.day}: ${r.views} views, ${r.likes} likes, ${r.comments} comments, ${r.posts} posts</title></rect>`}).join('')
   +`<text x="${p}" y="${h-6}" fill="#8f95b8" font-size="11">${rows[0].day}</text><text x="${w-p}" y="${h-6}" fill="#8f95b8" font-size="11" text-anchor="end">${rows[rows.length-1].day}</text><text x="${p}" y="14" fill="#8f95b8" font-size="11">max ${fmt(mx)} views</text></svg>`;}
function best(rows){return rows.filter(r=>r.posts>=2).sort((a,b)=>b.avg_views-a.avg_views)[0];}
async function load(){
  const q=new URLSearchParams({from:$('from').value,to:$('to').value,acct:$('acct').value,plat:$('plat').value,kind:$('kind').value});
  const d=await api('/api/analytics?'+q);const t=d.totals;
  $('notes').innerHTML=(d.notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join('');
  $('refresh').textContent=d.running?(d.msg||'Reading...'):'Refresh data';$('refresh').disabled=d.running;
  const bk=best(d.by_kind),bh=best(d.by_hour),bw=best(d.by_weekday);
  $('insight').innerHTML=t.posts?'<div class="insight"><b>What is working</b><br>'+[bk&&`Best content: <b>${bk.name}</b> (${fmt(bk.avg_views)} views per post, ${bk.eng}% engagement)`,bh&&`Best hour: <b>${bh.name}</b> (${fmt(bh.avg_views)} avg views)`,bw&&`Best day: <b>${bw.name}</b> (${fmt(bw.avg_views)} avg views)`,d.top[0]&&`Top post: <b>${esc(d.top[0].title)}</b> (${fmt(d.top[0].views)} views)`].filter(Boolean).join('<br>')+'<br><span class="dim" style="color:#7fc9a2">"Best" needs at least 2 posts in that group.</span></div>':'';
  $('kpi').innerHTML=[['Views',fmt(t.views),`${t.posts} posts, avg ${fmt(t.avg_views)}`],['Likes',fmt(t.likes),''],['Comments',fmt(t.comments),''],['Shares',fmt(t.shares),'Instagram only'],['Saves',fmt(t.saves),'Instagram only'],['Reach',fmt(t.reach),'Instagram only'],['Engagement',t.engagement+'%','likes+comments+shares+saves per view']].map(([k,v,s])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  $('growth').innerHTML=d.growth.length?d.growth.map(g=>`<div class="card"><div class="k">${esc(g.name)}</div><div class="v">${fmt(g.now)} <span class="${g.gain>=0?'pos':'neg'}" style="font-size:15px">${g.gain>=0?'+':''}${g.gain}</span></div><div class="s">since ${g.since}</div>${spark(g.series)}</div>`).join(''):'<div class="card dim">No follower data yet - tap Refresh data.</div>';
  $('growthnote').textContent=d.first_snapshot?`Followers and subscribers are counted from our own daily snapshots, which began on ${d.first_snapshot}; the platforms do not give past history. The change is only for the days you have selected from that date on.`:'';
  $('daily').innerHTML=dailyChart(d.daily);
  $('bykind').innerHTML=bars(d.by_kind,'avg_views',true);
  $('byhour').innerHTML=bars(d.by_hour,'avg_views',false);
  $('bywd').innerHTML=bars(d.by_weekday,'avg_views',false);
  $('byacct').innerHTML=bars(d.by_account,'avg_views',true);
  $('top').innerHTML='<tr><th>Post</th><th>Where</th><th>Type</th><th>Posted</th><th>Views</th><th>Likes</th><th>Cmts</th></tr>'+d.top.map(p=>`<tr><td class="ti"><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title||'(no title)')}</a></td><td>${esc(p.acct)} ${p.plat==='Instagram'?'IG':'YT'}</td><td>${p.kind}</td><td>${p.day.slice(5)}</td><td>${fmt(p.views)}</td><td>${p.likes}</td><td>${p.comments}</td></tr>`).join('');
  $('foot').textContent=(d.updated?'Data read '+new Date(d.updated).toLocaleString()+' and refreshed every 3 hours. ':'')+`${d.n_posts_all} posts tracked. Post numbers are the current lifetime totals of posts published in the chosen dates. Facebook is not included yet.`;
  if(d.running)setTimeout(load,3000);
}
$('refresh').onclick=async()=>{await api('/api/an_refresh',{});setTimeout(load,1500);};
setPreset('30 days');
</script></body></html>
