<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12"><title>Comments - Comment Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>
.list{display:grid;gap:14px;max-width:860px;margin:0 auto}
.listhead{display:flex;align-items:center;gap:10px;max-width:860px;margin:14px auto 12px}
.listhead .t{font-weight:600}.listhead .sp{margin-left:auto;display:flex;gap:4px}
.c{padding:16px 18px}
.c.sent{opacity:.72}
.c-top{display:flex;gap:12px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{color:var(--muted);font-size:12.5px}
.vid{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin:12px 0 0}
.vid svg{width:15px;height:15px}.vid a{color:#a99fff;text-decoration:none;margin-left:2px}
.vid .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ctx{margin:10px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);font-size:13px;color:var(--muted)}
.ctx b{color:var(--text);font-weight:600}
.msg{margin:12px 0 0;padding:11px 14px;border-radius:4px 14px 14px 14px;background:var(--surface2);font-size:15px;white-space:pre-wrap;word-break:break-word}
.lab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lab svg{width:14px;height:14px;stroke:var(--accent)}
textarea{width:100%;min-height:68px;resize:vertical;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;line-height:1.5}
.foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.foot .sp{margin-left:auto}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:14px;font-weight:500}
.sw input{display:none}
.sw i{width:38px;height:22px;border-radius:999px;background:var(--raise);border:1px solid var(--border2);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#9aa3b8;transition:.2s}
.sw input:checked+i{background:var(--accent);border-color:var(--accent)}
.sw input:checked+i::after{left:18px;background:#fff}
.done{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--ok-soft);color:#9be9c8;font-size:14px}
.done svg{stroke:var(--ok)}
.empty{max-width:860px;margin:30px auto;padding:56px 20px;text-align:center}
.empty .ring{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto 14px;color:#b9b0ff}
.empty .ring svg{width:26px;height:26px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,12,18,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .st{min-width:0;flex:1;font-size:12.5px;color:var(--muted);line-height:1.45}
.bar .st b{color:var(--text);font-weight:600}
.bar .btn.primary{padding:12px 22px;font-size:15px;white-space:nowrap}
@media(max-width:700px){.bar-in{flex-direction:column;align-items:stretch;gap:8px}.bar .st{text-align:center}.c{padding:14px}}
</style></head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>Comment Hub</div>
  <nav class="tabs"><a href="/" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Comments</a><a href="/analytics"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</a></nav>
  <button class="btn primary" id="refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg><span id="rtxt">Refresh</span></button>
</div></header>
<div class="wrap">
  <div class="chips" id="chips" style="max-width:860px;margin:0 auto"></div>
  <div id="demo" class="alert ok" hidden style="max-width:860px;margin:10px auto"><svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>Test mode: real comments are shown, but nothing is posted until DRY_RUN=0.</span></div>
  <div id="notes" style="max-width:860px;margin:0 auto"></div>
  <div class="listhead"><span class="t" id="count">Comments</span><span class="sp"><button class="btn ghost sm" id="selall">Select all</button><button class="btn ghost sm" id="selnone">Clear</button></span></div>
  <main class="list" id="list"></main>
</div>
<div class="bar"><div class="bar-in"><div class="st" id="info"></div><button class="btn primary" id="send">Send</button></div></div>
<script>
const DEMO = __DEMO__, AUTO = __AUTO__;
let items = [], filter = 'all', edits = {}, checked = {}, busy = false, caps = {}, sentToday = {};
const FILTERS = [['all','All'],['FragSpree|Instagram','FragSpree IG'],['FragSpree|YouTube','FragSpree YT'],['Brain Massage|Instagram','Brain IG'],['Brain Massage|YouTube','Brain YT'],['held','Held back'],['question','Questions'],['negative','Negative'],['spam','Spam']];
const $ = id => document.getElementById(id);
const api = (p, body) => fetch(p, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json','X-Hub':'1'}, body:JSON.stringify(body)}).then(r => r.json());
const I = {
  warn:'<svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  video:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="M16 10l6-3v10l-6-3z"/></svg>',
  spark:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  inbox:'<svg class="i" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>'};
const COLORS = ['#7c6bff','#5b8cff','#22c3a6','#f59e0b','#ec4899','#ef4444','#14b8a6','#8b5cf6'];
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<3600)return Math.max(1,Math.round(s/60))+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function colorOf(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];}
function visible(){return items.filter(i=>{
  if(filter==='all')return true;
  if(filter.includes('|'))return (i.acct+'|'+i.platform)===filter;
  if(filter==='held')return i.status==='new'&&i.held;
  return i.kind===filter;});}
function defaultChecked(i){return i.status==='new' && !!i.suggestion && !['spam','negative'].includes(i.kind);}
const KIND_PILL={question:['q','Question'],negative:['neg','Negative'],spam:['spam','Spam'],positive:['pos','Praise'],request:['q','Request']};
function render(){
  $('chips').innerHTML=FILTERS.map(([k,l])=>{const n=items.filter(i=>k==='all'?true:k.includes('|')?(i.acct+'|'+i.platform)===k:k==='held'?(i.status==='new'&&i.held):i.kind===k).length;return `<div class="chip ${filter===k?'on':''}" data-f="${k}">${l}<b>${n}</b></div>`}).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;render();});
  const v=visible();
  $('count').textContent=`${v.length} comment${v.length===1?'':'s'}`;
  $('list').innerHTML=v.length?v.map(i=>{
    if(!(i.key in checked))checked[i.key]=defaultChecked(i);
    const text=(i.key in edits)?edits[i.key]:i.suggestion;
    const sent=i.status==='sent', ig=i.platform==='Instagram', kp=KIND_PILL[i.kind];
    return `<article class="card c ${sent?'sent':''}" data-k="${esc(i.key)}">
      <div class="c-top"><div class="av" style="background:${colorOf(i.user)}">${esc((i.user||'?').replace('@','').charAt(0).toUpperCase())}</div>
        <div class="who"><b>${esc(i.user)}</b><span>${esc(i.acct)} &middot; ${ago(i.time)}</span></div>
        ${kp?`<span class="pill ${kp[0]}">${kp[1]}</span>`:''}<span class="pill ${ig?'ig':'yt'}">${ig?'Instagram':'YouTube'}</span></div>
      <div class="vid">${I.video}<span class="n">${esc(i.where||'')}</span>${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener">Open</a>`:''}</div>
      ${i.ctx ? `<div class="ctx"><b>Reel</b> ${esc((i.ctx.q || '').slice(0, 170))}${(i.ctx.q || '').length > 170 ? '...' : ''}<br><b>Answer</b> ${esc((i.ctx.a || '').slice(0, 120))}</div>` : ''}
      <div class="msg">${esc(i.text)}</div>
      ${sent?`<div class="done">${I.check}<span><b>Sent${i.auto?' automatically':''}:</b> ${esc(i.sent_text||'')}</span></div>`:`
      <div class="lab">${I.spark}Suggested reply</div>
      <textarea data-k="${esc(i.key)}" placeholder="No suggested reply. Write one, or skip.">${esc(text||'')}</textarea>
      <div class="foot"><label class="sw"><input type="checkbox" data-c="${esc(i.key)}" ${checked[i.key]?'checked':''}><i></i>Send this reply</label><span class="sp"></span><button class="btn ghost sm" data-s="${esc(i.key)}">Skip</button></div>`}
    </article>`}).join(''):`<div class="card empty"><div class="ring">${I.inbox}</div><b>No comments here yet</b><p class="muted" style="margin:6px 0 0">Tap Refresh to read the latest.</p></div>`;
  document.querySelectorAll('textarea').forEach(t=>{t.oninput=()=>{edits[t.dataset.k]=t.value;if(t.value.trim()){checked[t.dataset.k]=true;const cb=document.querySelector(`[data-c="${CSS.escape(t.dataset.k)}"]`);if(cb)cb.checked=true;}count();};});
  document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{checked[c.dataset.c]=c.checked;count();});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{await api('/api/skip',{keys:[b.dataset.s]});load();});
  count();
}
function toSend(){return visible().filter(i=>i.status==='new'&&checked[i.key]&&((i.key in edits?edits[i.key]:i.suggestion)||'').trim());}
function bulk(on){visible().forEach(i=>{if(i.status==='new'&&((i.key in edits?edits[i.key]:i.suggestion)||'').trim())checked[i.key]=on;});render();}
$('selall').onclick=()=>bulk(true);$('selnone').onclick=()=>bulk(false);
function count(){
  const n=toSend().length;
  $('send').textContent=busy?'Sending...':(n?`Approve & send ${n} repl${n===1?'y':'ies'}`:'Nothing selected');$('send').disabled=busy||!n;
  $('info').innerHTML=`<b>${n} selected</b> &middot; Today: Instagram ${sentToday.Instagram||0}/${caps.Instagram||'-'} &middot; YouTube ${sentToday.YouTube||0}/${caps.YouTube||'-'}`+(AUTO?'<br>Auto mode is on: safe replies go out by themselves, unclear ones wait under Held back.':'<br>One reply every ~20 seconds, like a person would.');
}
async function load(){
  const d=await api('/api/items');items=d.items;caps=d.caps;sentToday=d.sent_today;
  const notes=d.refresh.notes||[];$('notes').innerHTML=notes.map(n=>`<div class="alert">${I.warn}<span>${esc(n)}</span></div>`).join('');
  $('rtxt').textContent=d.refresh.running?d.refresh.msg||'Reading...':'Refresh';$('refresh').disabled=d.refresh.running;
  if(d.job.running){busy=true;$('info').innerHTML=`<b>Sending ${d.job.done}/${d.job.total}</b> &middot; ok ${d.job.ok} &middot; failed ${d.job.fail}`;}
  else if(busy){busy=false;if(d.job.fail)alert(`Sent ${d.job.ok}. ${d.job.fail} could not be sent:\n`+d.job.log.join('\n'));}
  if(!document.activeElement||document.activeElement.tagName!=='TEXTAREA')render();else count();
  return d;
}
$('refresh').onclick=async()=>{await api('/api/refresh',{});poll();};
$('send').onclick=async()=>{
  const list=toSend();if(!list.length)return;
  if(!confirm(`Send ${list.length} repl${list.length===1?'y':'ies'} now?\nThey post under your accounts and cannot be unsent here.`))return;
  const replies={};list.forEach(i=>replies[i.key]=(i.key in edits?edits[i.key]:i.suggestion).trim());
  const r=await api('/api/send',{replies});if(!r.ok){alert(r.error||'could not start');return;}
  busy=true;count();poll();
};
async function poll(){const d=await load();if(d.refresh.running||d.job.running)setTimeout(poll,2500);}
$('demo').hidden=!DEMO;
load().then(d=>{if(!d.items.length&&!d.refresh.running)api('/api/refresh',{}).then(poll);else if(d.job.running||d.refresh.running)poll();});
</script>
</body></html>
