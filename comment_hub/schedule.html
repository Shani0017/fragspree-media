<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12"><title>Schedule - Comment Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>
.wrap{padding-bottom:60px}
.acct{margin-top:26px}
.acct h2{margin:0 0 12px;font-size:20px;letter-spacing:-.01em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pc{padding:18px 20px;position:relative;overflow:hidden;border-top:4px solid var(--ok)}
.pc.warn{border-top-color:var(--warn)}.pc.bad{border-top-color:var(--bad)}
.pc .pl{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.07em}
.pc .pl .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.pc.warn .dot{background:var(--warn)}.pc.bad .dot{background:var(--bad)}
.pc .until{font-size:13.5px;color:var(--faint);margin-top:14px}
.pc .date{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.pc .meta{display:flex;gap:18px;margin-top:14px;color:var(--muted);font-size:14.5px;flex-wrap:wrap}
.pc .meta b{color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:5px;background:var(--raise);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ok)}.pc.warn .bar i{background:var(--warn)}.pc.bad .bar i{background:var(--bad)}
.note{color:var(--faint);font-size:13.5px;margin-top:22px}
.err{padding:16px 18px;margin-top:16px;border-color:rgba(248,113,113,.4);color:var(--bad)}
</style></head><body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>Comment Hub</div>
  <nav class="tabs"><a href="/"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Comments</a><a href="/analytics"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</a><a href="/schedule" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Schedule</a></nav>
</div></header>
<main class="wrap">
  <div id="upd" class="note" style="margin-top:4px">Loading...</div>
  <div id="out"></div>
  <p class="note">Facebook and YouTube publish by themselves at the scheduled time. Instagram posts are published by the VPS poster. Colours: green = 5+ days covered, amber = 2-5 days, red = under 2 days.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(iso){const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));return m<2?'just now':m<90?m+' minutes ago':m<2880?Math.round(m/60)+' hours ago':Math.round(m/1440)+' days ago'}
async function load(){
  try{
    const r=await fetch('/api/schedule');const d=await r.json();
    if(d.error){$('upd').textContent='';$('out').innerHTML='<div class="card err">'+esc(d.error)+'</div>';return}
    $('upd').innerHTML='Updated <b>'+esc(ago(d.updated))+'</b> by the PC (refreshes whenever it schedules posts)';
    $('out').innerHTML=d.accounts.map(a=>'<section class="acct"><h2>'+esc(a.name)+'</h2><div class="grid">'+a.plats.map(p=>{
      const pct=Math.max(3,Math.min(100,p.days/30*100));
      return '<div class="card pc '+esc(p.level)+'"><div class="pl"><span class="dot"></span>'+esc(p.name)+'</div>'+
        '<div class="until">Scheduled until</div><div class="date">'+esc(p.last)+'</div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="meta"><span><b>'+p.days+'</b> days ahead</span><span><b>'+p.count+'</b> posts waiting</span></div>'+
        (p.next&&p.next!=='-'?'<div class="until" style="margin-top:10px">Next post: '+esc(p.next)+'</div>':'')+'</div>'}).join('')+
      '</div>'+(a.yt_error?'<p class="note">YouTube: '+esc(a.yt_error)+'</p>':'')+'</section>').join('');
  }catch(e){$('out').innerHTML='<div class="card err">Could not load the schedule.</div>'}
}
load();setInterval(load,120000);
</script></body></html>
